[tool.poetry]
name = "dataverse-reports"
version = "2.2.0-SNAPSHOT"
description = "Generate and email statistical reports for content stored in Dataverse - https://dataverse.org/."
authors = ["Nicholas Woodward <woodward.nicholas@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
astroid = "^4.0.2"
bleach = "6.4.0"
certifi = "2026.7.22"
chardet = "7.6.0"
click = "8.5.0"
dataverse = {git = "https://github.com/IQSS/dataverse-client-python.git", rev = "5cdaadc2c3882d6fe23d3cb7cef5280fe83ba909"}
first = "==2.0.2"
html5lib = "==1.1"
idna = "3.20"
isort = "9.0.1"
lazy-object-proxy = "^1.12.0"
lxml = "6.1.3"
mccabe = "==0.7.0"
psycopg = "3.3.5"
pylint = "4.0.8"
pyparsing = "^3.2.5"
PyYAML = "^6.0.3"
requests = "2.34.2"
six = "^1.17.0"
toml = "==0.10.2"
urllib3 = "2.8.0"
webencodings = "0.6.1"
wrapt = "2.4.1"
XlsxWriter = "^3.2.9"
platformdirs = "4.11.9"
typing-extensions = "4.16.0"
tomlkit = "0.15.1"
charset-normalizer = "3.5.1"
dill = "^0.4.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
