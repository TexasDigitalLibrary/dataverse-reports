[tool.poetry]
name = "dataverse-reports"
version = "1.5.0"
description = "Generate and email statistical reports for content stored in Dataverse - https://dataverse.org/."
authors = ["nwoodward <woodward.nicholas@gmail.com>"]
license = "GPLv3"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
astroid = "^4.0.2"
bleach = "^6.3.0"
certifi = "^2025.11.12"
chardet = "5.2.0"
click = "^8.3.1"
dataverse = {git = "https://github.com/IQSS/dataverse-client-python.git", rev = "5cdaadc2c3882d6fe23d3cb7cef5280fe83ba909"}
first = "==2.0.2"
html5lib = "==1.1"
idna = "^3.11"
isort = "^7.0.0"
lazy-object-proxy = "^1.12.0"
lxml = "^6.0.2"
mccabe = "==0.7.0"
psycopg = "^3.3.2"
pylint = "^4.0.4"
pyparsing = "^3.2.5"
PyYAML = "^6.0.3"
requests = "^2.32.5"
six = "^1.17.0"
toml = "==0.10.2"
typed-ast = "==1.5.5"
urllib3 = "^2.6.2"
webencodings = "==0.5.1"
wrapt = "^2.0.1"
XlsxWriter = "^3.2.9"
platformdirs = "^4.5.1"
typing-extensions = "^4.15.0"
tomlkit = "^0.13.3"
charset-normalizer = "^3.4.4"
dill = "^0.4.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
